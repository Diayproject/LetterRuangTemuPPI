<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#31000d">
<title>A HEARTFELT LETTER </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Italianno&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--maroon:#31000d;--wine:#520b20;--pink:#f6dce7;--pink-soft:rgba(255,225,237,.76);--ink:#4b1828;--white:#fff9fb}
*{box-sizing:border-box}
html{min-height:100%;background:#260009}
body{margin:0;min-height:100vh;color:var(--white);font-family:'DM Sans',sans-serif;background:linear-gradient(180deg,rgba(30,0,8,.46),rgba(39,0,13,.68)),url("./background.webp") center center/cover fixed no-repeat;background-color:#31000d}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 15% 85%,rgba(201,30,69,.19),transparent 34%),linear-gradient(90deg,rgba(25,0,7,.18),transparent 48%,rgba(25,0,7,.22));z-index:0}
main{position:relative;z-index:1}
.screen{min-height:100svh;display:grid;place-items:center;padding:28px 16px}
.panel{width:min(650px,100%);text-align:center}
.brand{display:flex;justify-content:center;align-items:center;margin:0 auto 15px}
.brand img{width:94px;height:auto;max-height:118px;object-fit:contain;filter:drop-shadow(0 3px 12px rgba(0,0,0,.25))}
.eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#f3c8d8}
h1,h2{font-weight:400;color:#fff9fb;margin:12px 0}
h1{font-family:'DM Sans',sans-serif;font-weight:600;font-size:clamp(34px,8vw,55px);line-height:1.02}
h1 .script{font-family:'Italianno',cursive;font-size:1.55em;font-weight:400;line-height:.9;display:inline-block;color:#ffe5ef}
h2{font-family:'Cormorant Garamond',serif;font-size:clamp(30px,7vw,44px);margin:8px 0;color:#6a2038}
.sub{font-size:13px;line-height:1.8;color:#f4dbe4;max-width:390px;margin:0 auto 22px}
.status{font-size:12px;color:#ffe2ec;line-height:1.7;min-height:22px}
.glass{background:linear-gradient(135deg,rgba(255,230,239,.78),rgba(247,204,221,.56));border:1px solid rgba(255,244,249,.58);box-shadow:0 22px 70px rgba(15,0,6,.34),inset 0 1px 0 rgba(255,255,255,.6);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
button{font:inherit;border:1px solid rgba(255,239,246,.55);border-radius:999px;padding:13px 24px;background:linear-gradient(135deg,#f6dce7,#eab8cb);color:#4c1025;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.06em;box-shadow:0 8px 24px rgba(15,0,6,.2);transition:transform .2s,filter .2s}
button:hover{transform:translateY(-2px);filter:brightness(1.04)}
button:disabled{opacity:.6;cursor:wait;transform:none}
.envelope-wrap{width:min(330px,85vw);height:220px;margin:28px auto;position:relative;cursor:pointer;filter:drop-shadow(0 17px 18px rgba(0,0,0,.28))}
.envelope{position:absolute;inset:28px 0 0;background:linear-gradient(145deg,#f1c8d8,#b95d7a);border-radius:5px 5px 10px 10px}
.envelope:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,#f1c8d8,#c77a96);clip-path:polygon(0 0,50% 57%,100% 0,100% 100%,0 100%);z-index:3}
.envelope:after{content:"";position:absolute;inset:0;background:linear-gradient(35deg,#b85c78,#f1cada);clip-path:polygon(0 100%,50% 45%,100% 100%);z-index:4}
.flap{position:absolute;inset:0 0 auto;height:60%;background:#f6dce7;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1s;z-index:5}
.seal{position:absolute;z-index:6;left:50%;top:54%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:#6c1b37;color:#ffeaf1;display:grid;place-items:center;font-size:23px;transition:.4s}
.peek{position:absolute;z-index:2;left:8%;right:8%;height:165px;bottom:12px;background:#fff0f5;border-radius:4px;display:grid;place-items:center;color:#812c4a;font-family:'Italianno',cursive;font-size:34px;transition:transform 1s}
.envelope-wrap.open .flap{transform:rotateX(180deg);z-index:1}
.envelope-wrap.open .seal{opacity:0}
.envelope-wrap.open .peek{transform:translateY(-115px)}
.paper{width:min(760px,100%);padding:clamp(25px,6vw,58px);border-radius:22px;background:#F4EDE4;border:1px solid rgba(255,247,250,.68);box-shadow:0 24px 80px rgba(12,0,5,.42),inset 0 1px 0 rgba(255,255,255,.72);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);position:relative;text-align:left;animation:rise .9s both;color:var(--ink);overflow:hidden}
.paper:before{content:"";position:absolute;inset:11px;border:1px solid rgba(120,37,66,.22);border-radius:14px;pointer-events:none}
.paperhead{text-align:center;margin-bottom:28px;position:relative}
.paperhead .brand{margin-bottom:14px}
.paperhead .brand img{width:78px;filter:drop-shadow(0 2px 4px rgba(80,10,32,.1))}
.flower{font-size:25px;color:#a54b69}
.to{font-family:'Italianno',cursive;font-size:clamp(36px,8vw,48px);line-height:1.1;color:#6b1838;margin-top:8px}
.bodycopy{font-family:'Cormorant Garamond',serif;font-size:clamp(19px,4vw,23px);line-height:1.75;color:#4d2031;white-space:pre-wrap;overflow-wrap:anywhere;position:relative}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;margin:28px 0;position:relative}
.gallery img{width:100%;aspect-ratio:4/5;object-fit:cover;border:1px solid rgba(126,48,75,.28);padding:4px;background:rgba(255,255,255,.58);border-radius:10px}
.closing{font-family:'Italianno',cursive;font-size:38px;color:#81294a;text-align:right;margin-top:28px;position:relative}
.sign{text-align:right;color:#79445a;font-size:12px;position:relative}
.letter-actions{text-align:center;margin-top:30px;position:relative}
.back-btn{background:rgba(86,17,43,.92);color:#fff0f5;border-color:rgba(255,255,255,.35)}
.hidden{display:none!important}
@keyframes rise{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}
@media(max-width:480px){.brand img{width:82px}.screen{padding:22px 13px}.paper{border-radius:18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* PPI visual refinement: Warm Ivory letter panel and burgundy details */
:root{--pink:#F4EDE4;--pink-soft:rgba(244,237,228,.88);--ink:#4b1828;--white:#F4EDE4}
.paper{background:#F4EDE4!important;color:#4b1828!important;border:1px solid rgba(255,255,255,.72);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 24px 80px rgba(12,0,5,.48),inset 0 1px 0 rgba(255,255,255,.8)}
.paper:before{border-color:rgba(82,11,32,.24)}
.paperhead h2,.to,.closing{color:#520b20}
.bodycopy{color:#3f1725}
.sign{color:#6b3b4b}
.gallery img{background:#fffaf4;border-color:rgba(82,11,32,.2)}
button{background:linear-gradient(135deg,#F4EDE4,#e7d8ca);color:#520b20;border-color:rgba(255,255,255,.7)}
.back-btn{background:#520b20!important;color:#F4EDE4!important;border-color:rgba(82,11,32,.3)!important}
.envelope{background:linear-gradient(145deg,#8b4358,#520b20)}
.envelope:before{background:linear-gradient(145deg,#a35d70,#6c263d)}
.envelope:after{background:linear-gradient(35deg,#520b20,#a35d70)}
.flap{background:#b47b86}
.seal{background:#F4EDE4;color:#520b20;border:1px solid rgba(82,11,32,.18)}
.peek{background:#F4EDE4;color:#520b20}
.glass{background:linear-gradient(135deg,rgba(244,237,228,.22),rgba(244,237,228,.10));border-color:rgba(244,237,228,.28)}
@media(max-width:480px){.paper{padding:28px 22px}}

/* Full supplied Ruang Temu letter artwork, displayed intact on the ivory letter page */
.letter-artwork-wrap{width:100%;max-width:760px;margin:22px auto 30px;padding:0;background:transparent;display:flex;justify-content:center}
.letter-artwork{display:block;width:100%;height:auto;max-width:100%;object-fit:contain;border:0;border-radius:0;box-shadow:0 12px 32px rgba(49,0,13,.12)}
@media(max-width:480px){.letter-artwork-wrap{margin:16px auto 24px}.letter-artwork{width:100%}}
</style>
</head>
<body>
<main>
<section class="screen" id="loading">
  <div class="panel">
    <div class="brand"><img src="./logo-ppi-white.webp" alt="Pejuang Pulih Indonesia"></div>
    <div class="eyebrow">a little something, made for you</div>
    <h1>A Letter<br><span class="script">for You</span></h1>
    <p class="sub">Sebentar, kami sedang menyiapkan suratmu…</p>
    <div class="status" id="loadStatus"></div>
  </div>
</section>
<section class="screen hidden" id="envelopeScreen">
  <div class="panel">
    <div class="brand"><img src="./logo-ppi-white.webp" alt="Pejuang Pulih Indonesia"></div>
    <div class="eyebrow">a little piece of heart </div>
    <h1>A Heartfelt Letter <span class="script">for You</span></h1>
    <p class="sub" id="helloText">Ada surat yang menunggumu.</p>
    <div class="envelope-wrap" id="envelope" role="button" tabindex="0" aria-label="Buka amplop">
      <div class="peek">for the special one</div>
      <div class="envelope"><div class="flap"></div><div class="seal">✿</div></div>
    </div>
    <button id="openBtn">Buka surat</button>
    <div class="status" id="letterStatus"></div>
  </div>
</section>
<section class="screen hidden" id="letterView">
  <article class="paper">
    <header class="paperhead">
      <div class="brand"><img src="./logo-ppi-maroon.webp" alt="Pejuang Pulih Indonesia"></div>
      <div class="eyebrow" style="color:#8b4961">a heartfelt for you </div>
    <div class="letter-artwork-wrap"><img class="letter-artwork" src="./surat-peserta.webp" alt="A Heartfelt Letter for You — desain surat Ruang Temu PPI"></div>
      <div class="to" id="recipientName"></div>
    </header>
    <div class="bodycopy" id="letterBody"></div>
    <div class="gallery" id="gallery"></div>
    <div class="closing">Shalsabila Ananda,</div>
    <div class="sign" id="senderName"></div>
    <div class="note" style="text-align:center;margin-top:28px;letter-spacing:.12em;color:#85556a;font-size:10px">Teruslah bertumbuh dengan lebih lembut</div>
    <div class="letter-actions"><button class="back-btn" id="backBtn" type="button">Kembali ke halaman depan surat</button></div>
  </article>
</section>
</main>
<script type="module" src="./letter.js"></script>
<script type="module">
const backBtn = document.getElementById("backBtn");
backBtn?.addEventListener("click", () => {
  document.getElementById("letterView").classList.add("hidden");
  document.getElementById("envelopeScreen").classList.remove("hidden");
  document.getElementById("envelope").classList.remove("open");
  const openBtn = document.getElementById("openBtn");
  openBtn.disabled = false;
  openBtn.textContent = "Buka surat";
  window.scrollTo({top:0,behavior:"smooth"});
});
</script>
</body>
</html>
